<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Age Checker</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: rgb(128, 247, 247);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 50px;
        }

        .box {
            background-color: rgb(239, 243, 243);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 40vh;
            margin: 0;
        }

        .box-content {
            padding: 30px;
        }

        .box-content input {
            margin-top: 20px;
            padding: 20px;
            width: 80%;
        }

        .box-content button {
            margin-top: 10px;
            padding: 20px;
            width: 50%;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #output {
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 20px;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="box-content">
            <h1>Check Your Age Category</h1>

            <div class="user-info">
                <input type="number" id="user" placeholder="Enter Your Age">

                <button type="button" onclick="checkResult()">Submit</button>
            </div>

            <div id="output">

            </div>
        </div>
    </div>

    <script>
        function checkResult() {
            let user_Age = document.getElementById("user").value;
            // console.log(user_Age);

            if(user_Age === ""){
                alert("Please Enter your Age");
                return;
            }

            if(user_Age <= 0){
                alert("please Enter Vaild Age")
            }

            let displayAge = checkAge(user_Age);
            // console.log(displayAge);


            let Result = document.getElementById("output");
            Result.innerHTML = `
                <h2> Result: </h2>
                <h3> ${displayAge} </h3>
            `;
        }


        function checkAge(user_Age) {
            if (user_Age >= 18) {
                return "You are Eligible to Vote";
            } else {
                return "You are Not Eligible to Vote";
            }
        }
    </script>
</body>

</html>
